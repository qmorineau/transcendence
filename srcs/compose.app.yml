services:
  # SSH-PONG
  ssh-pong:
    build: ./ssh-pong
    image: ssh-pong
    container_name: ssh-pong
    ports:
      - "2223:22"
    user: "root"
    volumes:
      - ssh_host_keys:/etc/ssh/keys:rw
      # - ../srcs/CLI:/app/cli:ro
      - ../srcs/ssh-pong/pam_sshd:/etc/pam.d/sshd:ro
      - ../srcs/nginx/certs/cert.pem:/app/cert.pem:ro
    secrets:
      - player_password
    environment:
      SSH_PASSWORD: ${SSH_PASSWORD}
      ENABLE_SSHGUARD: "0"
    restart: unless-stopped
    networks:
      - app-network
  # FRIENDS
  social:
    build: ./backend/social
    image: social
    container_name: social
    volumes:
      - social-data:/app/data
      # - ../srcs/backend/social/srcs:/app/srcs
    environment:
      DATABASE_URL: "file:/app/data/social.sqlite"
      REDIS_URL: ${REDIS_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    networks:
      - app-network

  # USERS
  identity:
    build: ./backend/identity
    image: identity
    container_name: identity
    volumes:
      - identity-data:/app/data
      - avatars:/app/public/avatars
      # - ../srcs/backend/identity/srcs:/app/srcs # => TO REMOVE
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: "file:/app/data/identity.sqlite"
      REDIS_URL: ${REDIS_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  # USER STATS
  user-stats:
    build: ./backend/userStats
    image: user-stats
    container_name: user-stats
    volumes:
      - userStats-data:/app/data
      # - ../srcs/backend/userStats/srcs:/app/srcs
    environment:
      DATABASE_URL: "file:/app/data/userStats.sqlite"
      REDIS_URL: ${REDIS_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    restart:
      always
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  # REDIS MESSAGE BROKER
  redis:
    image: redis:8-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "supersecret"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

  # GAME LOGIC
  app:
    build: ./backend/node-app
    image: app
    container_name: app
    volumes:
      # - ../srcs/nginx/certs/ca.crt:/app/ca.crt
      # - ../srcs/nginx/certs/server.crt:/app/server.crt
      # - ../srcs/nginx/certs/server.key:/app/server.key
      # - ../srcs/nginx/certs/app-client.crt:/app/app-client.crt
      # - ../srcs/nginx/certs/app-client.key:/app/app-client.key
      - sqlite-data:/app/data
      # - ../srcs/backend/node-app/srcs:/app/srcs  # => TO REMOVE
    environment:
      DATABASE_URL: "file:/app/data/pong.sqlite"
      NODE_ENV: "production"
      PORT: "3000"
      HOST: "0.0.0.0"
      REDIS_URL: ${REDIS_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  AI: 
    build: ./backend/ia
    image: ia-client
    container_name: ia-client
    # volumes:
    #   - ../srcs/nginx/certs/ca.crt:/app/ca.crt 
    #   - ../srcs/nginx/certs/ai-client.crt:/app/ai-client.crt
    #   - ../srcs/nginx/certs/ai-client.key:/app/ai-client.key
    #   - ../srcs/nginx/certs/ai-server.crt:/app/ai-server.crt
    #   - ../srcs/nginx/certs/ai-server.key:/app/ai-server.key
    #   - ../srcs/nginx/certs/server.crt:/app/server.crt
    #   - ../srcs/backend/ia/srcs:/app/srcs # => TO REMOVE
    environment:
      NODE_ENV: "production"
      PORT: "3001"
      HOST: "0.0.0.0"
    restart: always
    networks:
      - app-network
    depends_on:
      app:
        condition: service_healthy

  # SQLITE WEB VIEWER
  sqlite-web:
    image: coleifer/sqlite-web
    container_name: sqlite-web
    ports:
      - "8191:8080"
    networks:
      - app-network
    volumes:
      # - sqlite-data:/data
      - sqlite-data:/data
    entrypoint: ["sqlite_web"]
    command: ["-H","0.0.0.0","-p","8080","/data/pong.sqlite"]

  #  REVERSE PROXY
  nginx:
    image:  nginx:1.29.0-alpine-slim
    container_name: nginx
    ports:
      - "8080:443"
    volumes:
      - ../srcs/nginx/certs/ca.crt:/etc/nginx/ssl/ca.crt
      - ../srcs/nginx/certs/cert.pem:/etc/nginx/ssl/cert.pem
      - ../srcs/nginx/certs/key.pem:/etc/nginx/ssl/key.pem
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
      - ./nginx/static:/usr/share/nginx/html
    # depends_on:
    #   - node-app
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    image:  nginx:1.29.0-alpine-slim
    container_name: frontend
    expose:
      - "443"
    volumes:
      - ../srcs/nginx/certs/cert.pem:/etc/nginx/ssl/cert.pem
      - ../srcs/nginx/certs/key.pem:/etc/nginx/ssl/key.pem   
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - app-network

volumes:
  nginx-logs:
    name: "nginx-logs"
  userStats-data:
    name: "userStats-data"
  identity-data:
    name: "identity-data"
  social-data:
    name: "social-data"
  sqlite-data:
    name: "sqlite-data"
  avatars:
    name: "avatars"
  redis-data:
    name: "redis-data"
  ssh_host_keys:
    name: "ssh_host_keys"

networks:
  app-network: 
    driver: bridge
    name: "app-network"

secrets:
  player_password:
    file: ../secrets/player_password.txt