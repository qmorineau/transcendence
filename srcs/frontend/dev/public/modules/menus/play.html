<div class="w-full h-full flex flex-col items-center gap-5">

	<!-- header -->
	<div class="w-full flex flex-row gap-5 p-5">
		<button id="transBtn" class="font-title text-3xl">Transcendance</button>
		<h1 class="font-title text-catpuccin-mauve text-3xl">Play</h1>
	</div>



	<div id="menu" class="flex-1 flex flex-col w-full items-end mt-40 gap-10 transform transition-transform duration-300 translate-x-full">
		<!-- back -->
		<button id="homeBtn" class="flex flex-row border border-catpuccin-white h-[150px] w-[300px] px-10 gap-10 items-center transform transition-[width] duration-300 hover:w-[350px]">
			<h1 class="font-title text-5xl w-fit">Back</h1>
		</button>

		<!-- local -->
		<button id="localgameBtn" class="flex flex-row border border-catpuccin-mauve h-[150px] w-[60%] px-10 gap-10 items-center transform transition-[width] duration-300 hover:w-[65%]">
			<i class="bi bi-lightning-charge-fill text-5xl"></i> <h1 class="font-title text-5xl w-fit">1v1 local</h1>
		</button>

		<!-- matchmaking -->
		<button id="matchmakingBtn" class="flex flex-row border border-catpuccin-mauve h-[150px] w-[60%] px-10 gap-10 items-center transform transition-[width] duration-300 hover:w-[65%]">
			<i class="bi bi-lightning-charge-fill text-5xl"></i> <h1 class="font-title text-5xl w-fit">Matchmaking</h1>
		</button>

		<!-- IA -->
		<button id="TrainingBtn" class="flex flex-row border border-catpuccin-peach h-[150px] w-[60%] px-10 gap-10 items-center transform transition-[width] duration-300 hover:w-[65%]">
			<i class="bi bi-lightning-charge-fill text-5xl"></i> <h1 class="font-title text-5xl w-fit">Training</h1>
		</button>


		<!-- create tournament -->
		<button id="createBtn" class="flex flex-row border border-catpuccin-green h-[150px] w-[60%] px-10 gap-10 items-center transform transition-[width] duration-300 hover:w-[65%]">
			<i class="bi bi-plus-square-fill text-5xl"></i> <h1 class="font-title text-5xl w-fit">Create Tournament</h1>
		</button>
		
		<!-- join tournament -->
		<button id="joinBtn" class="flex flex-row border border-catpuccin-green h-[150px] w-[60%] px-10 gap-10 items-center transform transition-[width] duration-300 hover:w-[65%]">
			<i class="bi bi-arrow-right-square-fill text-5xl"></i> <h1 class="font-title text-5xl w-fit">Join Tournament</h1>
		</button>

	</div>

</div>
