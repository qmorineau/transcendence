<h1 class="font-title text-3xl md:text-4xl lg:text-4xl">Good to see you there!</h1>

<!-- form  -->
<form id="login_form" class="flex flex-col w-full gap-5 justify-center items-center">
	<div class="flex flex-row w-full justify-center items-center bg-transparent border border-white rounded-full p-3 gap-3 text-xl max-w-2xl">
		<i class="bi bi-person-circle"></i>
		<input id="login_uname" type="text" placeholder="username..." class="border-none bg-transparent focus:outline-none focus:ring-0 focus:border-none flex-1 min-w-0">
	</div>

	<div class="flex flex-row w-full justify-center items-center bg-transparent border border-white rounded-full p-3 gap-3 text-xl max-w-2xl">
		<i class="bi bi-asterisk"></i>
		<input id="login_paswd" type="password" placeholder="password..." class="border-none bg-transparent focus:outline-none focus:ring-0 focus:border-none flex-1 min-w-0">
	</div>

	<button type="submit" class="flex flex-row w-full justify-center items-center bg-gray-800 rounded-full p-3 gap-3 text-xl max-w-2xl" id="login_button"> 
		<strong>log-in</strong><i class="bi bi-box-arrow-in-right"></i>
	</button>
</form>

<a id="github" href='/api/user/github/start'
	class="flex flex-row w-full justify-center items-center bg-gray-800 rounded-full p-3 gap-3 text-xl max-w-2xl">
	<i class="bi bi-github"></i><strong>Remote Authentication With GitHub</strong>
</a>

<!-- api login error --> 
<div id="error_box"></div>

<!-- mini signin -->
<p class="md:hidden">no account ? <button id="to_signin2" class="text-gray-200">sign-in</button></p>
