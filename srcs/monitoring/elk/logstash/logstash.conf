input {
  beats {
    port => 5044
    ssl_enabled  => true
    ssl_certificate => "/usr/share/logstash/certs/logstash/logstash.crt"
    ssl_key => "/usr/share/logstash/certs/logstash/logstash.key"
    ssl_client_authentication => none
    # ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
  }
}

filter {
  grok {
    # match => { "message" => "%{COMBINEDAPACHELOG}" }
    match => { "message" => [
        '%{IP:remote_addr} \[%{HTTPDATE:time_local}\] "%{WORD:method} %{URIPATHPARAM:uri} HTTP/%{NUMBER:http_version}" %{NUMBER:status:int} %{NUMBER:body_bytes_sent} "(?:%{URI:referrer}|-)" "%{DATA:user_agent}" rt="%{NUMBER:request_time:float}" uct="(?:%{NUMBER:upstream_connect_time:float}|-)" uht="(?:%{NUMBER:upstream_header_time:float}|-)" urt="(?:%{NUMBER:upstream_response_time:float}|-)"'
      ]
    }
  }
  date {
      match => ["time_local", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
      remove_field => ["time_local"]
  }
}

output {
  elasticsearch {
    hosts => "${ELASTIC_HOSTS}"
    user=> "${ELASTIC_USER}"
    password=> "${ELASTIC_PASSWORD}"
    # ssl => true
    # cacert => "/usr/share/logstash/certs/ca/ca.crt"
    ssl_enabled => true
    ssl_certificate_authorities=> "/usr/share/logstash/certs/ca/ca.crt"
    index => "nginx-%{+YYYY.MM.dd-HH}"
  }
  # DEBUG
  # stdout { codec => rubydebug }
}