global:
  scrape_interval: 15s  # Frequency of metric scraping
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
      - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
  
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          app: 'nginx-internal'

  - job_name: 'nginx-log-metrics'
    static_configs:
      - targets: ['nginx-log-exporter:4040']
        labels:
          app: 'nginx-log'
  
  - job_name: 'backend'
    static_configs:
      - targets: ['app:3000']
        labels:
          app: 'backend'
          service: 'game'
      - targets: ['ia-client:3001']
        labels:
          app: 'backend'
          service: 'AI'
      - targets: ['social:3000']
        labels:
          app: 'backend'
          service: 'social'
      - targets: ['identity:3000']
        labels:
          app: 'backend'
          service: 'identity'
      - targets: ['user-stats:3000']
        labels:
          app: 'backend'
          service: 'user-stats'


