events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # LOG FORMAT https://docs.nginx.com/nginx/admin-guide/monitoring/logging/
    log_format upstream_time '$remote_addr [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'rt="$request_time" uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    # ENABLE ACCESS LOGS
    access_log /var/log/nginx/metrics_access.log upstream_time;

    # ENABLE ERROR LOGS ON WARN LEVEL
    error_log /var/log/nginx/error.log warn;


    upstream app { server app:3000; }
    upstream user-stats { server user-stats:3000; }
    upstream identity { server identity:3000; }
    upstream social { server social:3000; }

    server {
        listen 443 ssl;
		http2 on;

		ssl_certificate /etc/nginx/ssl/cert.pem;
		ssl_certificate_key /etc/nginx/ssl/key.pem;

		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_prefer_server_ciphers on;
		ssl_ciphers HIGH:!aNULL:!MD5;

        server_name localhost;

        location /favicon.ico {
            return 444;
            access_log off;
            log_not_found off;
        }
        # INTERNAL ROUTE FOR AUTH
        location = /_auth {
            internal;
            proxy_pass http://identity/internal/auth/verify;

            proxy_pass_request_body off;       # don't send client body
            proxy_set_header Content-Length "";
            # forward the credentials (header and cookies)
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie        $http_cookie;
            # (optional) forward context
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
        }

        # FRONT END
        location / {
            proxy_pass https://frontend:443;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'Upgrade';
            proxy_set_header Host $host;
            # proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded_Proto https;

			proxy_ssl_server_name on;
			proxy_pass_request_headers on;
			proxy_cookie_path / /;
            
            proxy_intercept_errors on;
            error_page 404 =302 /;
        }

        # USER ROUTES (SEMI_PROTECTED)
        location /api/user/ {
            proxy_pass http://identity;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'Upgrade';
            proxy_set_header Host $host;
            # proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded_Proto https;
            
            proxy_pass_request_headers on;
			proxy_cookie_path / /;
        }

        # PROTECTED ROUTES
        location /api/stats/ {
            # authenticate
            auth_request /_auth;

            # pull identity headers from subrequest
            auth_request_set $user_id     $upstream_http_x_user_id;
            auth_request_set $user_login  $upstream_http_x_user_login;
            auth_request_set $user_title  $upstream_http_x_user_title;

            proxy_pass http://user-stats;

            proxy_set_header X-User-Id    $user_id;
            proxy_set_header X-User-Login $user_login;
            proxy_set_header X-User-title $user_title;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'Upgrade';
            proxy_set_header Host $host;
            # proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded_Proto https;
            
            proxy_pass_request_headers on;
			proxy_cookie_path / /;

            error_page 401 = @unauthorized;
            error_page 403 = @forbidden;
        }

        location /api/friends/ {
            # authenticate
            auth_request /_auth;

            # pull identity headers from subrequest
            auth_request_set $user_id     $upstream_http_x_user_id;
            auth_request_set $user_login  $upstream_http_x_user_login;
            auth_request_set $user_title  $upstream_http_x_user_title;

            proxy_pass http://social;

            proxy_set_header X-User-Id    $user_id;
            proxy_set_header X-User-Login $user_login;
            proxy_set_header X-User-title $user_title;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'Upgrade';
            proxy_set_header Host $host;
            # proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded_Proto https;
            
            proxy_pass_request_headers on;
			proxy_cookie_path / /;

            error_page 401 = @unauthorized;
            error_page 403 = @forbidden;
        }


        location /api/ {
            # authenticate
            auth_request /_auth;

            # pull identity headers from subrequest
            auth_request_set $user_id     $upstream_http_x_user_id;
            auth_request_set $user_login  $upstream_http_x_user_login;
            auth_request_set $user_title  $upstream_http_x_user_title;

            client_max_body_size 3m;
            proxy_pass http://app;

            # inject trusted identity headers
            proxy_set_header X-User-Id    $user_id;
            proxy_set_header X-User-Login $user_login;
            proxy_set_header X-User-title $user_title;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'Upgrade';
            proxy_set_header Host $host;
            # proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded_Proto https;

			proxy_pass_request_headers on;
			proxy_cookie_path / /;

            error_page 401 = @unauthorized;
            error_page 403 = @forbidden;
        }
        
        location @unauthorized { return 401; }
        location @forbidden    { return 403; }

        location /nginx_status { # STUB STATUS FOR METRICS 
            stub_status on;
            allow 127.0.0.1; # Allow access from localhost
            allow 172.18.0.0/16; # Allow access for the docker network
            deny all;

            access_log off;
        }

    }
    server {
        listen 80;

        location /nginx_status { # STUB STATUS FOR METRICS 
            stub_status on;
            allow 127.0.0.1; # Allow access from localhost
            allow 172.18.0.0/16; # Allow access for the docker network
            deny all;

            access_log off;
        }
    }
}